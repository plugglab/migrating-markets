# MigratingMarkets by PluggLab Studio
# ------------------------------------------------------------------
# Advanced traveling caravan market system.
# Each caravan follows a route of waypoints, stops for a configurable
# number of in-game "market days", then moves to the next stop.
# Prices react to real supply/demand and decay back toward base over time.
# Every item also has a level (1-5): higher levels restock deeper each
# market day (stock cap = level * settings.stock-per-level).

settings:
  # How many real-world minutes make up one "market day" tick.
  minutes-per-market-day: 20
  # How many market-days a caravan lingers at each stop before moving on.
  days-per-stop: 3
  # Radius (blocks) players must be within to open the market GUI.
  interaction-radius: 4
  # Radius (blocks) around a traveling caravan considered "escort range".
  escort-radius: 12
  # Broadcast messages to the whole server when a caravan arrives/departs.
  broadcast-server-wide: true
  # Exact next destination is hidden; players only get a vague directional hint.
  vague-destination-hints: true
  # Price change per unit bought/sold (percentage, e.g. 0.02 = 2%).
  price-shift-per-trade: 0.02
  # How much prices decay back toward base per market-day (percentage).
  price-decay-per-day: 0.05
  # Max multiplier prices can swing to, above/below base (e.g. 2.5 = up to 250%/40%).
  max-price-multiplier: 2.5
  min-price-multiplier: 0.4
  # Stock cap per item = item level * this number, fully replenished each market-day.
  stock-per-level: 6

# Currency the market buys/sells in.
#   provider: emerald  -> uses physical emeralds in the player's inventory (default, no dependency)
#   provider: vault    -> uses whatever economy plugin Vault has registered (Essentials, CMI, etc)
#                         falls back to emeralds automatically if Vault/an economy plugin isn't found
economy:
  provider: emerald

# Bridge to PluggLab Studio's LuckyBlock 2.0 plugin, using its real
# developer API (com.lucky.luckyblock.api.LuckyBlockAPI) — the API jar is
# bundled in libs/ at build time, and the actual LuckyBlock plugin
# provides the implementation at runtime. Items in the "fortune"
# specialty below use `rarity: COMMON|RARE|EPIC|LEGENDARY` to grant a
# real lucky block ItemStack (sellable, just like any other item).
#
# give-command-template below is kept only as a generic fallback
# mechanism for bridging to some OTHER command-driven plugin via
# `give-command` on an item — it is NOT used by the `rarity`-based
# fortune items above, which go through the real API directly.
lucky-block-bridge:
  plugin-name: LuckyBlock
  give-command-template: "lb give %player% %amount%"

routes:
  eastern-loop:
    display-name: "&6Eastern Caravan"
    specialty: blacksmith
    waypoints:
      - world: world
        x: 100
        y: 70
        z: 100
        name: "Ridgeway Crossing"
      - world: world
        x: 250
        y: 68
        z: 40
        name: "Hollow Bridge"
      - world: world
        x: 180
        y: 72
        z: -120
        name: "Ashfield"

  wandering-enchanter:
    display-name: "&5Wandering Enchanter"
    specialty: enchanter
    waypoints:
      - world: world
        x: -80
        y: 65
        z: 200
        name: "Moonlit Hollow"
      - world: world
        x: -220
        y: 70
        z: 90
        name: "Duskmere"

  exotic-trader:
    display-name: "&bExotic Trader"
    specialty: exotic
    waypoints:
      - world: world
        x: 300
        y: 64
        z: 300
        name: "Saltmarsh Docks"
      - world: world
        x: 400
        y: 80
        z: 150
        name: "Highspire"
      - world: world
        x: 320
        y: 70
        z: -50
        name: "Redstone Bazaar"

  # Only spawns if the plugin named under lucky-block-bridge.plugin-name is installed.
  fortune-caravan:
    display-name: "&dTraveling Fortune Teller"
    specialty: fortune
    requires-plugin: LuckyBlock
    waypoints:
      - world: world
        x: 60
        y: 70
        z: -200
        name: "Gambler's Rest"
      - world: world
        x: -140
        y: 68
        z: -260
        name: "Wishing Well"

