# Escort reputation tiers: kills of hostile mobs near a traveling caravan
# earn reputation with that caravan, unlocking discounts at its next stop.
escort-reputation:
  tiers:
    - threshold: 5
      discount: 0.05
      title: "Trusted Escort"
    - threshold: 15
      discount: 0.10
      title: "Caravan Guardian"
    - threshold: 30
      discount: 0.18
      title: "Legendary Warden"
